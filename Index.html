    header { background: #cc0000; color: white; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #900000; }
    .site-title { font-size: 2.4rem; font-weight: bold; letter-spacing: -1px; padding: 1rem 0; text-transform: uppercase; }
    .site-title span { color: #ffcccc; font-size: 1rem; display: block; letter-spacing: 2px; font-family: Arial, sans-serif; font-weight: normal; }
    .sign-in-btn { background: white; color: #cc0000; border: none; padding: 0.5rem 1.2rem; font-size: 0.9rem; font-family: Arial, sans-serif; font-weight: bold; cursor: pointer; border-radius: 3px; text-decoration: none; }
    .sign-in-btn:hover { background: #ffe0e0; }

    nav { background: #111; display: flex; overflow-x: auto; }
    nav a { color: #fff; text-decoration: none; padding: 0.75rem 1.4rem; font-family: Arial, sans-serif; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; border-right: 1px solid #333; }
    nav a:hover, nav a.active { background: #cc0000; }

    .ticker-wrap { background: #cc0000; color: white; display: flex; align-items: center; overflow: hidden; font-family: Arial, sans-serif; font-size: 0.85rem; }
    .ticker-label { background: #900000; padding: 0.4rem 1rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
    .ticker-content { padding: 0.4rem 1rem; white-space: nowrap; animation: ticker 20s linear infinite; }
    @keyframes ticker { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    .section-heading { font-family: Arial, sans-serif; font-size: 1rem; font-weight: bold; text-transform: uppercase; color: #cc0000; border-bottom: 3px solid #cc0000; padding-bottom: 0.4rem; margin-bottom: 1.2rem; }
    .section { margin-bottom: 2.5rem; }
    .article-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
    .article-card { background: white; border: 1px solid #ddd; overflow: hidden; cursor: pointer; }
    .article-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .article-card .img-placeholder { width: 100%; height: 160px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #aaa; font-family: Arial, sans-serif; font-size: 0.8rem; }
    .article-card .card-content { padding: 0.9rem; }
    .article-card h3 { font-size: 1rem; line-height: 1.4; margin-bottom: 0.4rem; }
    .article-card h3 a { color: #111; text-decoration: none; }
    .article-card h3 a:hover { color: #cc0000; }
    .excerpt { font-size: 0.85rem; color: #555; line-height: 1.5; font-family: Arial, sans-serif; }
    .meta { font-family: Arial, sans-serif; font-size: 0.75rem; color: #999; margin-top: 0.6rem; }
    .loading { font-family: Arial, sans-serif; color: #888; padding: 1rem 0; }

    footer { background: #111; color: #aaa; text-align: center; padding: 1.5rem; font-family: Arial, sans-serif; font-size: 0.85rem; margin-top: 2rem; }
    footer a { color: #cc0000; text-decoration: none; }

    @media (max-width: 768px) {
      .article-grid { grid-template-columns: 1fr; }
      .site-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

    <div class="section">
      <div class="section-heading">Latest News</div>
      <div id="article-grid" class="article-grid">
        <p class="loading">Loading articles...</p>
      </div>
    </div>

    <meta name="8acf4608b264e52f2dc5eca34c20a32ea59f7ac0" content="8acf4608b264e52f2dc5eca34c20a32ea59f7ac0" />
  </div>

  </footer>

  <script>
    const REPO = "MrStormy134/crossyroad2";
    const BRANCH = "main";

    async function loadArticles() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/articles?ref=${BRANCH}`);
        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          document.getElementById('article-grid').innerHTML = '<p class="loading">No articles yet.</p>';
          return;
        }

        const articles = await Promise.all(mdFiles.map(async f => {
          const r = await fetch(f.download_url);
          const text = await r.text();
          return parseArticle(text, f.name);
        }));

        // Sort newest first
        articles.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        renderArticles(articles);
      } catch (e) {
        document.getElementById('article-grid').innerHTML = '<p class="loading">Failed to load articles.</p>';
      }
    }

    function parseArticle(text, filename) {
      const frontmatter = text.match(/---\n([\s\S]*?)\n---/);
      const meta = {};
      if (frontmatter) {
        frontmatter[1].split('\n').forEach(line => {
          const colonIndex = line.indexOf(':');
          if (colonIndex > -1) {
            const key = line.substring(0, colonIndex).trim();
            const val = line.substring(colonIndex + 1).trim().replace(/^["']|["']$/g, '');
            if (key) meta[key] = val;
          }
        });
      }
      const body = text.replace(/---[\s\S]*?---/, '').trim();
      return { ...meta, body, filename };
    }

    function renderArticles(articles) {
      const grid = document.getElementById('article-grid');
      grid.innerHTML = articles.map(a => {
        const imageUrl = a.image ? (a.image.startsWith('http') ? a.image : `/images/uploads/${a.image.replace('/images/uploads/', '')}`) : null;
        const excerpt = a.body.replace(/[#*`]/g, '').substring(0, 120).trim();
        return `
          <article class="article-card" onclick="window.location.href='article.html?file=${encodeURIComponent(a.filename)}'">
            ${imageUrl
              ? `<img src="${imageUrl}" style="width:100%;height:160px;object-fit:cover;" onerror="this.parentNode.innerHTML='<div class=\\'img-placeholder\\'>No Image</div>'">`
              : '<div class="img-placeholder">No Image</div>'}
            <div class="card-content">
              <h3><a href="article.html?file=${encodeURIComponent(a.filename)}">${a.title || 'Untitled'}</a></h3>
              <p class="excerpt">${excerpt}...</p>
              <div class="meta">${a.date || ''}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    loadArticles();
  </script>

</body>
</html>
